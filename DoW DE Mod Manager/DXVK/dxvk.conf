[W40k.exe]

# D3D9 floating-point quirk handling.
# Auto lets DXVK choose the appropriate path.
d3d9.floatEmulation = Auto

# Useful for discrete GPUs and appropriate for this game.
d3d9.deviceLocalConstantBuffers = True

# Keep modern pipeline compilation enabled.
dxvk.enableGraphicsPipelineLibrary = Auto

# NVIDIA's optimized Vulkan path.
dxvk.enableNvRawAccessChains = True

# Use all available CPU cores for pipeline compilation.
dxvk.numCompilerThreads = 0

# Do not force Windows exclusive fullscreen.
dxvk.allowFse = False